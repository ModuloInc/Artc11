# Article11 – Docker Compose
# Usage:
#   db only:    docker compose up -d
#   app + db:   docker compose --profile app up -d
#
# Avec Traefik : définir DOMAIN (ex. app.example.com) puis --profile app.
# Le réseau "web" doit exister (généralement créé par Traefik).

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: example
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:example@db:5432/postgres
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-in-production}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - app
    networks:
      - default
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.article11-frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.article11-frontend.entrypoints=websecure"
      - "traefik.http.routers.article11-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.article11-frontend.loadbalancer.server.port=3000"

  # Shell avec Node + projet monté : npm install, prisma db push, prisma db seed
  cli:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      DATABASE_URL: postgresql://postgres:example@db:5432/postgres
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - app
    networks:
      - default
    command: sh
    stdin_open: true
    tty: true

networks:
  web:
    external: true
